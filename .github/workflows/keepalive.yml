name: Keep Supabase alive

# Free Supabase projects pause after a week of inactivity.
# /api/health runs a trivial DB query, so a ping every 3 days keeps the project awake.
on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /api/health
        env:
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then echo "Set the APP_URL repository secret"; exit 1; fi
          curl --fail --silent --show-error --retry 3 --retry-delay 10 "${APP_URL%/}/api/health"
